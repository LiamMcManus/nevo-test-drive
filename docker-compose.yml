services:
  backend:
    container_name: backend
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/usr/src/app
      - ./backend/data:/usr/src/app/data
    environment:
      - DEV_MODE=false

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
    environment:
      - DEV_MODE=false
    depends_on:
      - backend
